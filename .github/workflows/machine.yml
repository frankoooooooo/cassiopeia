name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Pinned: the SDK commit everyday-012 was built and tested on. Bump it on purpose.
  OPEN_XY_REF: 14d595b0c018238e69f9c9e30a19e0deae7d055e
jobs:
  machine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [schedar, caph, navi, ruchbah, segin, achird]
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Shared header copies match
        run: sh machine/tools/sync_common.sh --check
      - name: Screens under the sanitizers
        run: sh machine/tools/screen_sweep.sh "$PWD/open-xy/sdk/include" clang++ ${{ matrix.machine }}
      - name: Machine source, preview and sound checks
        run: python open-xy/sdk.py test --machine machine/${{ matrix.machine }} --cxx clang++ --host-cxx g++
  firmware:
    runs-on: windows-latest
    strategy:
      matrix:
        machine: [schedar, caph, navi, ruchbah, segin, achird]
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Native compile (no stock firmware or device)
        run: python open-xy/sdk.py compile --machine machine/${{ matrix.machine }} --out "${{ runner.temp }}/module"
